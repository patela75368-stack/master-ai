<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master AI - Video Remix</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:900px;margin:auto;padding:16px}header{background:#111827;color:white}.logo{font-size:24px;font-weight:800} .card{background:white;border:1px solid #ddd;border-radius:18px;padding:18px;margin-top:16px}.upload{display:block;border:2px dashed #bbb;padding:25px;text-align:center;border-radius:15px;cursor:pointer}input[type=file]{display:none}video{width:100%;max-height:430px;background:#000;border-radius:14px;margin-top:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #bbb;border-radius:10px}button{border:0;border-radius:11px;padding:12px 16px;background:#111827;color:#fff;font-weight:700;margin:5px;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.note{background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px;font-size:13px}.hidden{display:none}.msg{margin-top:12px;font-weight:600}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head>
<body><header><div class="wrap"><div class="logo">✦ Master AI</div>AI Video Remix</div></header>
<main class="wrap"><div class="card"><h2>🎬 Video Trim + Download</h2>
<div class="note">केवल अपनी या अधिकृत वीडियो इस्तेमाल करें। यह copyright detection या Content ID bypass नहीं करता। Processing browser में होती है।</div>
<label class="upload">📤 <b>Video चुनें</b><br><small>पहले छोटी वीडियो से test करें</small><input id="file" type="file" accept="video/*"></label>
<div id="workspace" class="hidden"><video id="video" controls></video>
<div class="row"><div class="field"><label>Start (seconds)</label><input id="start" type="number" min="0" value="0" step=".1"></div><div class="field"><label>End (seconds)</label><input id="end" type="number" min="0" value="0" step=".1"></div></div>
<button class="secondary" onclick="setStart()">Start = current time</button><button class="secondary" onclick="setEnd()">End = current time</button><button onclick="trimVideo()">✂️ Trim & Export</button>
<div id="status" class="msg"></div><a id="download" class="hidden"><button>⬇️ Download trimmed video</button></a></div></div></main>
<script>
const fi=document.getElementById('file'),v=document.getElementById('video'),w=document.getElementById('workspace'),s=document.getElementById('start'),e=document.getElementById('end'),msg=document.getElementById('status');
fi.onchange=()=>{let f=fi.files[0];if(!f)return;v.src=URL.createObjectURL(f);w.classList.remove('hidden');v.onloadedmetadata=()=>{s.value=0;e.value=v.duration.toFixed(1)};msg.textContent='वीडियो तैयार है।'};
function setStart(){s.value=v.currentTime.toFixed(1)} function setEnd(){e.value=v.currentTime.toFixed(1)}
async function trimVideo(){let a=Number(s.value),b=Number(e.value);if(!(b>a)){msg.textContent='End time, Start से बड़ा होना चाहिए।';return}if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){msg.textContent='इस browser में local export उपलब्ध नहीं है। Chrome का नया version आज़माएँ।';return}
let c=document.createElement('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;let x=c.getContext('2d'),stream=c.captureStream(30),r=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];
r.ondataavailable=q=>{if(q.data.size)chunks.push(q.data)};r.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}),u=URL.createObjectURL(blob),d=document.getElementById('download');d.href=u;d.download='master-ai-trimmed.webm';d.classList.remove('hidden');msg.textContent='Trim complete! Download दबाएँ।'};
msg.textContent='Processing…';v.currentTime=a;await new Promise(q=>v.onseeked=q);r.start();v.play();
function draw(){if(!v.paused){x.drawImage(v,0,0,c.width,c.height);requestAnimationFrame(draw)}}draw();setTimeout(()=>{v.pause();r.stop()},(b-a)*1000)}
</script></body></html>
